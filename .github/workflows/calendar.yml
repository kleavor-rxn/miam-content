name: Extend daily picks
on:
  schedule:
    - cron: "0 5 * * 1"   # chaque lundi 05:00 UTC
  workflow_dispatch:
jobs:
  extend:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m tools.build_index
      - run: |
          git config user.name "miam-content-bot"
          git config user.email "bot@raxoon.com"
          git add ./*/index.json
          git diff --cached --quiet || git commit -m "chore: extension du calendrier dailyPicks"
          git push
